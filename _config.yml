# =============================================================================
# Md Monirul Islam — Portfolio Site Configuration
# GitHub: https://github.com/Monirul305/Monirul305.github.io
# URL:    https://Monirul305.github.io
# Based on al-folio theme: https://github.com/alshedivat/al-folio
# =============================================================================

# -----------------------------------------------------------------------------
# Site Settings
# -----------------------------------------------------------------------------
title: blank                          # Required by al-folio; do not change
first_name: Md Monirul
last_name: Islam
email: monirulislam.acad@gmail.com

description: >
  R&D Engineer & Team Lead at Cybernetics Hi-Tech Solutions.
  Robotics · Motion Control · Autonomous Systems · Embedded Hardware.
  B.Sc. EEE, BUET (CGPA 3.85, ranked 25/189).

footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a>
  with <a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a>.

keywords: >
  robotics, motion control, autonomous systems, embedded hardware, mechatronics,
  ROS 2, MoveIt, AGV, EOD ROV, BUET, Bangladesh, PhD applicant

lang: en
icon: "⚙️"   # favicon emoji

url: https://Monirul305.github.io
baseurl: ""                           # empty for username.github.io sites

# -----------------------------------------------------------------------------
# Theme / Layout
# -----------------------------------------------------------------------------
repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: true
  theme_light: flat
  theme_dark: gitdimmed

navbar_fixed: true
footer_fixed: false
max_width: 800px

# -----------------------------------------------------------------------------
# Profile / Sidebar
# -----------------------------------------------------------------------------
# Profile picture: place your photo at assets/img/prof_pic.jpg
# Recommended: 800×800 px, plain background, JPG

profile_picture: prof_pic.jpg        # filename inside assets/img/

# -----------------------------------------------------------------------------
# Social / Academic Links
# ⚠️  Fill in the PLACEHOLDER values before going live
# -----------------------------------------------------------------------------
github_username: Monirul305
linkedin_username: monirul-islam-460001148

# CREATE THESE FIRST — each takes ~10 minutes:
scholar_userid:        # PLACEHOLDER — visit scholar.google.com, create profile, paste the ID from the URL
orcid_id:              # PLACEHOLDER — register at orcid.org, paste your 16-digit ORCID
research_gate_profile: # PLACEHOLDER — your ResearchGate username
semanticscholar_id:    # PLACEHOLDER — optional

# Leave blank:
twitter_username:
gitlab_username:
bluesky_url:
mastodon_url:

# -----------------------------------------------------------------------------
# Open Graph (social preview when sharing link)
# -----------------------------------------------------------------------------
og_image:              # leave blank to use site icon

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------
google_analytics:      # PLACEHOLDER — paste GA4 measurement ID (G-XXXXXXXXXX)
                       # Get from analytics.google.com (free)
                       # Lets you see which professors visit and from which referrer

# -----------------------------------------------------------------------------
# News / Announcements
# -----------------------------------------------------------------------------
announcements:
  enabled: true
  scrollable: true
  limit: 6             # show 6 most recent news items on the home page

# -----------------------------------------------------------------------------
# Latest Posts (blog) — disabled for now
# -----------------------------------------------------------------------------
latest_posts:
  enabled: false
  scrollable: false
  limit: 3

# -----------------------------------------------------------------------------
# Selected Papers on Home Page
# -----------------------------------------------------------------------------
# Papers with selected=true in papers.bib appear in the "Selected Publications"
# block on the about page. Currently: your GA-PID first-author paper.

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

# -----------------------------------------------------------------------------
# Jekyll Scholar (publications rendering)
# -----------------------------------------------------------------------------
scholar:
  last_name: [Islam]
  first_name: [Md Monirul, M. Monirul, Monirul]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"
  sort_by: year
  order: descending

# Bold your own name in citation lists:
author_name_bold: true

# -----------------------------------------------------------------------------
# Markdown & Syntax Highlighting
# -----------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

highlighter: rouge

# -----------------------------------------------------------------------------
# RSS / Feed
# -----------------------------------------------------------------------------
rss_icon: true

# -----------------------------------------------------------------------------
# Jekyll Settings
# -----------------------------------------------------------------------------
include: ["_pages"]
exclude:
  - bin/
  - Gemfile
  - Gemfile.lock
  - vendor
  - "*.sh"
  - README.md
  - SETUP.md

keep_files:
  - CNAME
  - .nojekyll
  - .git

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-toc
  - jemoji

# -----------------------------------------------------------------------------
# Pagination
# -----------------------------------------------------------------------------
pagination:
  enabled: true
  per_page: 5
  sort_field: "date"
  sort_reverse: true

# -----------------------------------------------------------------------------
# External link attributes
# -----------------------------------------------------------------------------
link-attributes:
  attributes:
    - key: target
      value: _blank
  matchers:
    - type: ExternalUrlMatcher

# -----------------------------------------------------------------------------
# Image optimization (optional, requires ImageMagick)
# -----------------------------------------------------------------------------
imagemagick:
  enabled: false
