github_users:
  - Monirul305

github_repos:
  # Vision / ML
  - repo: Monirul305/Yolo-based-traffic-speed-estimation-system
    description: Per-vehicle speed estimation from monocular highway video using YOLO object detection. BUET computer-vision course project.

  # Robotics / autonomy
  - repo: Monirul305/Automatic-drone-delivery-system-using-GPS
    description: Autonomous GPS-waypoint drone for parcel delivery — flight controller and mission logic.

  - repo: Monirul305/Designing-and-Implementation-of-Robotic-Arm-with-5-Degree-of-Freedom
    description: 5-DOF articulated robotic arm (plus gripper) — kinematics, control electronics, and end-effector design.

  # Digital design / VLSI
  - repo: Monirul305/Design-and-Verification-of-a-RISC--V-Multicycle-Processor-and-a-Memory-Controller-with-Wishbone-Inte
    description: Custom multicycle RV32I RISC-V processor + Wishbone-interfaced memory controller, with a full testbench-based verification suite.

  - repo: Monirul305/Designing-A-regulated-Boost-converter-using-tsmc180nm-technology-in-Cadence
    description: Voltage-regulated DC-DC boost converter designed in Cadence on TSMC 180 nm — schematic capture and physical layout.

  - repo: Monirul305/Implementation-of-OMR-machine-using-digital-logic-circuit
    description: Optical Mark Recognition machine built entirely from discrete digital logic ICs — no microcontroller in the loop.

  # Mechatronics / hardware
  - repo: Monirul305/Designing-and-Implementation-of-A-3D-printing-Machine
    description: Early academic implementation of a 3D printer — the precursor work that fed into the Titan 550 CoreXY platform at Cybernetics.

  - repo: Monirul305/Real-Time-Environmental-Monitoring-System
    description: IoT environmental monitoring (temperature, humidity, air quality) with real-time dashboard.

  - repo: Monirul305/Detection-of-Particle-Concentration-Using-Light-Scattering-Mechanism
    description: Particle-concentration sensor using a laser + photodetector light-scattering setup, with calibration curves and signal-conditioning circuit.

  # Power / control
  - repo: Monirul305/Closed-loop-speed-control-of-induction-motor-using-MATLAB-SIMULINK-
    description: MATLAB / Simulink model of closed-loop speed control for a 3-phase induction motor — V/f scalar control with SVPWM inverter modulation.

  - repo: Monirul305/Design-and-Implication-of-Laboratory-Variable-DC-Power-Supply
    description: Bench-grade variable DC power supply — linear-regulator design with current limiting and short-circuit protection.

  # Power systems / building services
  - repo: Monirul305/Electrical-Services-Design-A-Project-on-Electrical-Design-on-Seven-Storied-Building
    description: End-to-end electrical-services design for a seven-storey residential building — load estimation, panel scheduling, cable sizing, lighting / power layouts, riser diagram, earthing scheme.
